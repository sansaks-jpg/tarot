<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#161817" />
    <title>The Tarot Room — Ada Cerita di Balik Kartu</title>
    <meta
      name="description"
      content="Duduk, pilih pertanyaan, dan buka tiga kartu bersama Sela. Game tarot berbahasa Indonesia, gratis dan tanpa login."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="The Tarot Room — Game Tarot Tiga Kartu"
    />
    <meta
      property="og:description"
      content="Pilih pertanyaan, ambil tiga kartu, dan dengarkan bacaan Sela. Koleksi 78 kartu bisa kamu lihat terpisah."
    />
    <meta property="og:image" content="/assets/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css?v=home-2" />
    <link rel="preload" href="/assets/cards/back.svg?v=room-4" as="image" />
    <link rel="preload" href="/assets/brand.webp" as="image" />
    <link rel="preload" href="/assets/cards/m17.webp" as="image" media="(min-width: 700px)" />
    <link rel="preload" href="/assets/welcome-room.webp" as="image" media="(max-width: 699px)" />
    <link
      rel="preload"
      href="/assets/presence-mobile.webp"
      as="image"
      media="(max-width: 699px)"
    />
    <script type="module" src="/app.js?v=home-2"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Tarot Room",
        "description": "Game tarot tiga kartu berbahasa Indonesia dengan pembaca virtual.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "id",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" }
      }
    </script>
  </head>
  <body>
    <div class="room-backdrop" role="img" aria-label="Sela di meja tarot dengan cahaya lilin"></div>
    <a class="skip-link" href="#main">Langsung ke isi</a>
    <header class="site-header">
      <a
        class="wordmark"
        href="#beranda"
        aria-label="The Tarot Room, beranda"
      >
        <img
          src="/assets/brand.webp"
          alt="The Tarot Room"
          class="brand-logo"
          width="160"
          height="88"
          fetchpriority="high"
        />
      </a>
      <div class="header-tools">
        <nav class="room-nav" aria-label="Navigasi utama">
          <a href="#beranda" data-nav="beranda">Beranda</a>
          <a href="#bacaan" data-nav="bacaan" data-reading-link>Baca tarot</a>
          <a class="room-switcher" id="roomSwitcher" href="#kartu" data-nav="kartu"><span class="nav-full-label">Koleksi kartu</span><span class="nav-short-label">Kartu</span></a>
        </nav>
        <div class="sound-control">
          <button
            class="icon-button sound-toggle"
            id="soundToggle"
            type="button"
            data-action="sound"
            aria-pressed="true"
            aria-label="Matikan musik dan efek suara"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M11 5 6 9H3v6h3l5 4zM16 9l5 6m0-6-5 6" />
            </svg>
          </button>
          <button
            class="icon-button"
            id="volumeToggle"
            type="button"
            data-action="volume"
            aria-expanded="false"
            aria-controls="soundSettings"
            aria-label="Atur volume"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 17h16M8 4v6m8 4v6" />
            </svg>
          </button>
          <div class="sound-settings" id="soundSettings" hidden>
            <label for="soundVolume"
              >Volume <output id="volumeLabel">100%</output></label
            >
            <input
              id="soundVolume"
              type="range"
              min="0"
              max="100"
              value="100"
              aria-label="Volume musik dan efek suara"
            />
            <p>Musik, efek kartu, dan suara pembaca.</p>
          </div>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <div class="noscript">
        Aktifkan JavaScript untuk memasuki The Tarot Room dan membaca kartumu.
      </div>
    </noscript>
  </body>
</html>
