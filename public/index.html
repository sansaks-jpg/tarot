<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#161817" />
    <title>The Tarot Room — Ada Cerita di Balik Kartu</title>
    <meta
      name="description"
      content="Duduk, pilih pertanyaan, dan buka tiga kartu bersama Sela. Game tarot berbahasa Indonesia, gratis dan tanpa login."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="The Tarot Room — Game Tarot Tiga Kartu"
    />
    <meta
      property="og:description"
      content="Pilih pertanyaan, ambil tiga kartu, dan dengarkan bacaan Sela. Koleksi 78 kartu bisa kamu lihat terpisah."
    />
    <meta property="og:image" content="/assets/social.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/assets/favicon.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css?v=room-7" />
    <link rel="stylesheet" href="/room-ui.css?v=room-7" />
    <link rel="preload" href="/assets/cards/back.svg?v=room-7" as="image" />
    <link rel="preload" href="/assets/brand.webp" as="image" />
    <link rel="preload" href="/assets/cards/m17.webp" as="image" media="(min-width: 700px)" />
    <link rel="preload" href="/assets/welcome-room.webp" as="image" media="(max-width: 699px)" />
    <link
      rel="preload"
      href="/assets/presence-mobile.webp"
      as="image"
      media="(max-width: 699px)"
    />
    <script type="module" src="/app.js?v=room-7"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "The Tarot Room",
        "description": "Game tarot tiga kartu berbahasa Indonesia dengan pembaca virtual.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Any",
        "inLanguage": "id",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IDR" }
      }
    </script>
  </head>
  <body>
    <div class="room-backdrop" role="img" aria-label="Sela di meja tarot dengan cahaya lilin"><div class="room-scene"></div><div class="room-floor"></div></div>
    <a class="skip-link" href="#main">Langsung ke isi</a>
    <header class="site-header">
      <a
        class="wordmark"
        href="#beranda"
        aria-label="The Tarot Room, beranda"
      >
        <img
          src="/assets/brand.webp"
          alt="The Tarot Room"
          class="brand-logo"
          width="160"
          height="88"
          fetchpriority="high"
        />
      </a>
      <div class="header-tools">
        <nav class="room-nav" aria-label="Navigasi utama">
          <a href="#beranda" data-nav="beranda" aria-label="Beranda" title="Beranda"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9v12h14V9M9 21v-7h6v7"/></svg></a>
          <a href="#bacaan" data-nav="bacaan" data-reading-link aria-label="Baca tarot" title="Baca tarot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg></a>
          <a class="room-switcher" id="roomSwitcher" href="#kartu" data-nav="kartu" aria-label="Koleksi kartu" title="Koleksi kartu"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="12" height="18" rx="2"/><path d="m5 5-3 1 4 15m8-14 2 4-2 4-2-4z"/></svg></a>
        </nav>
        <div class="sound-control">
          <button
            class="icon-button"
            id="volumeToggle"
            type="button"
            data-action="volume"
            aria-expanded="false"
            aria-controls="soundSettings"
            aria-label="Atur musik dan suara Sela"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M4 17h16M8 4v6m8 4v6" />
            </svg>
          </button>
          <div class="sound-settings" id="soundSettings" hidden>
            <div class="sound-settings-heading"><strong>Suasana & suara</strong><button class="text-button" id="soundToggle" type="button" data-action="sound" aria-pressed="true" aria-label="Matikan semua suara">Senyapkan</button></div>
            <label for="musicVolume">Musik <output id="musicVolumeLabel">65%</output></label>
            <input id="musicVolume" type="range" min="0" max="100" value="65" aria-label="Volume musik dan efek kartu" />
            <label for="narratorVolume">Suara Sela <output id="narratorVolumeLabel">100%</output></label>
            <input id="narratorVolume" type="range" min="0" max="100" value="100" aria-label="Volume narator Sela" />
          </div>
        </div>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <dialog id="modal" aria-labelledby="modalTitle">
      <div id="modalBody"></div>
    </dialog>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <noscript>
      <div class="noscript">
        Aktifkan JavaScript untuk memasuki The Tarot Room dan membaca kartumu.
      </div>
    </noscript>
  </body>
</html>
